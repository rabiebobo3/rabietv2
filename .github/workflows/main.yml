      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        shell: bash
        working-directory: rabie-src
        run: |
          chmod +x gradlew
          OK=0
          for i in 1 2 3; do
            echo "===== محاولة بناء رقم $i"
            if ./gradlew :app:assembleDebug --no-daemon --max-workers=2; then OK=1; break; fi
            echo "فشلت المحاولة $i — تنظيف القفل وإعادة المحاولة بعد 20 ثانية"
            sleep 20
          done
          if [ "$OK" != "1" ]; then echo "فشل البناء بعد 3 محاولات"; exit 1; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RabieTV2-debug-apk
          path: rabie-src/app/build/outputs/apk/debug/app-debug.apk

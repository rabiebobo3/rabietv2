      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        shell: bash
        working-directory: rabie-src
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RabieTV2-debug-apk
          path: rabie-src/app/build/outputs/apk/debug/app-debug.apk
